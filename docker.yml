services:
  # ============================
  # MySQL - MS CLIENTES
  # ============================
  mysql-clientes:
    image: mysql:8.0
    container_name: mysql-clientes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_clientes
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - clientes_data:/var/lib/mysql
      - ./ms-clientes/src/main/resources/bd-clientes.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=caching_sha2_password # Comando restaurado
    ports:
      - "3306:3306"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ============================
  # MySQL - MS LOGISTICA
  # ============================
  mysql-logistica:
    image: mysql:8.0
    container_name: mysql-logistica
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_logistica
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - logisticas_data:/var/lib/mysql
      - ./ms-logistica/src/main/resources/bd-logistica.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=caching_sha2_password # Comando restaurado
    ports:
      - "3307:3306"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ============================
  # MySQL - MS TARIFAS
  # ============================
  mysql-tarifas:
    image: mysql:8.0
    container_name: mysql-tarifas
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bd_tarifas
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    volumes:
      - tarifas_data:/var/lib/mysql
      - ./ms-tarifas/src/main/resources/bd-tarifas.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=caching_sha2_password # Comando restaurado
    ports:
      - "3308:3306"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 5

  # ============================
  # OSRM (Servicio de Ruteo)
  # ============================
  osrm:
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    container_name: osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/argentina-251112.osrm
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/route/v1/driving/-64.1888,-31.4201;-64.4280,-31.6589 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================
  # 🔑 KEYCLOAK (Autenticación)
  # ============================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      # CLAVE: Usamos el hostname interno de Docker para que el 'iss' del token coincida con el config de los MS
      # Esto inhabilita el acceso directo al frontend de Keycloak desde el navegador, pero soluciona el JWT.
      #KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_URL: http://keycloak:8080
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/logistica-realm.json
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-config/logistica-realm.json:/opt/keycloak/data/import/logistica-realm.json
    command: start-dev --import-realm
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ============================
  # MS CLIENTES
  # ============================
  ms-clientes:
    build: ./ms-clientes
    container_name: ms-clientes
    restart: unless-stopped
    depends_on:
      mysql-clientes:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-clientes:3306/bd_clientes?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpass
      SERVER_PORT: 8081
      # Ahora esto coincide con el 'iss' del token de Keycloak
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/logistica-realm
    ports:
      - "8081:8081"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================
  # MS LOGISTICA
  # ============================
  ms-logistica:
    build: ./ms-logistica
    container_name: ms-logistica
    restart: unless-stopped
    depends_on:
      mysql-logistica:
        condition: service_healthy
      ms-clientes:
        condition: service_healthy
      osrm:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-logistica:3306/bd_logistica?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpass
      SERVER_PORT: 8082
      MS_CLIENTES_URL: http://ms-clientes:8081/api/v0.1
      OSRM_BASE_URL: http://osrm:5000
      # Ahora esto coincide con el 'iss' del token de Keycloak
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/logistica-realm
    ports:
      - "8082:8082"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================
  # MS TARIFAS
  # ============================
  ms-tarifas:
    build: ./ms-tarifas
    container_name: ms-tarifas
    restart: unless-stopped
    depends_on:
      mysql-tarifas:
        condition: service_healthy
      ms-logistica:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-tarifas:3306/bd_tarifas?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpass
      SERVER_PORT: 8083
      MS_LOGISTICA_URL: http://ms-logistica:8082/api/v0.1
      # Ahora esto coincide con el 'iss' del token de Keycloak
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/logistica-realm
    ports:
      - "8083:8083"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================
  # 🛡️ API GATEWAY
  # ============================
  apigateway:
    build: ./apigateway
    container_name: apigateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      ms-clientes:
        condition: service_healthy
      ms-logistica:
        condition: service_healthy
      ms-tarifas:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      # Ambos usan la URL interna. El Gateway puede alcanzar Keycloak directamente.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/logistica-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/logistica-realm/protocol/openid-connect/certs
      MS_CLIENTES_URL: http://ms-clientes:8081
      MS_LOGISTICA_URL: http://ms-logistica:8082
      MS_TARIFAS_URL: http://ms-tarifas:8083
    ports:
      - "8080:8080"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  clientes_data:
  logisticas_data:
  tarifas_data:
  keycloak_data:

networks:
  microservices-network:
    driver: bridge